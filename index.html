<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .pdf-wrapper {
      width: 100%;
      height: 100vh;
    }

    object {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="pdf-wrapper">
    <object data="Portfolio.pdf" type="application/pdf">
      <p>
        Your browser does not support PDFs.
        <a href="Portfolio.pdf" target="_blank">Download the PDF</a>.
      </p>
    </object>
  </div>
</body>
</html>
